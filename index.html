<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>電費計算工具</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="電費計算">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222637;
    --border: #2e3347;
    --accent: #5b8df6;
    --accent2: #f6c25b;
    --green: #4ecb85;
    --red: #f05d5d;
    --text: #e8eaf2;
    --text2: #8b90a8;
    --text3: #555a72;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: calc(32px + var(--safe-top)) 16px calc(80px + var(--safe-bottom));
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: rgba(91,141,246,0.12);
    border: 1px solid rgba(91,141,246,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    color: var(--text);
  }

  h1 span { color: var(--accent2); }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text2);
    font-weight: 300;
  }

  .install-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: rgba(91,141,246,0.1);
    border: 1px solid rgba(91,141,246,0.25);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    gap: 12px;
  }

  .install-banner.show { display: flex; }
  .install-text { font-size: 13px; color: var(--text2); flex: 1; }
  .install-text strong { color: var(--accent); display: block; margin-bottom: 2px; }

  .install-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 12px;
    font-weight: 500;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .install-dismiss {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .icon-blue { background: rgba(91,141,246,0.15); }
  .icon-yellow { background: rgba(246,194,91,0.15); }
  .icon-green { background: rgba(78,203,133,0.15); }

  .card-title { font-size: 15px; font-weight: 500; }
  .card-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }

  label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: 0.03em; }

  .input-wrap { position: relative; }

  input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 44px 12px 14px;
    font-size: 16px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -moz-appearance: textfield;
  }

  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,141,246,0.12);
  }

  .input-unit {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    pointer-events: none;
  }

  .month-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .month-display {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--accent2);
    background: rgba(246,194,91,0.1);
    border: 1px solid rgba(246,194,91,0.2);
    border-radius: 8px;
    padding: 6px 14px;
  }

  .month-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    padding: 6px 14px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-btn:active { background: var(--border); }

  .derived {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    min-height: 46px;
    display: flex;
    align-items: center;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .result-row:last-child { border-bottom: none; }
  .result-label { font-size: 13px; color: var(--text2); }
  .result-value { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
  .result-value.accent { color: var(--accent); }

  .big-amounts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .amount-box {
    border-radius: 14px;
    padding: 18px;
    text-align: center;
  }

  .amount-box.me { background: rgba(91,141,246,0.1); border: 1px solid rgba(91,141,246,0.25); }
  .amount-box.tenant { background: rgba(246,194,91,0.1); border: 1px solid rgba(246,194,91,0.25); }

  .amount-person { font-size: 12px; margin-bottom: 8px; font-weight: 500; letter-spacing: 0.05em; }
  .amount-box.me .amount-person { color: var(--accent); }
  .amount-box.tenant .amount-person { color: var(--accent2); }

  .amount-number { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; line-height: 1; }
  .amount-box.me .amount-number { color: var(--accent); }
  .amount-box.tenant .amount-number { color: var(--accent2); }

  .amount-unit { font-size: 12px; margin-top: 4px; opacity: 0.7; }

  .notion-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .notion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .notion-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .notion-logo { width: 20px; height: 20px; background: white; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #000; }

  .copy-btn {
    background: rgba(91,141,246,0.15);
    border: 1px solid rgba(91,141,246,0.3);
    border-radius: 8px;
    color: var(--accent);
    font-size: 12px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
  }

  .copy-btn:active { opacity: 0.7; }
  .copy-btn.copied { background: rgba(78,203,133,0.15); border-color: rgba(78,203,133,0.3); color: var(--green); }

  .notion-preview {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid var(--border);
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    min-height: 56px;
  }

  .history-item:active { background: var(--border); }
  .history-month { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent2); }
  .history-amounts { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .history-del {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    padding: 8px;
    line-height: 1;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-history { text-align: center; color: var(--text3); font-size: 13px; padding: 24px; }

  .save-btn {
    width: 100%;
    margin-top: 12px;
    background: rgba(78,203,133,0.12);
    border: 1px solid rgba(78,203,133,0.25);
    border-radius: 10px;
    padding: 14px;
    color: var(--green);
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 48px;
  }

  .save-btn:active { background: rgba(78,203,133,0.22); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 400px) {
    .field-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: auto; }
    .big-amounts { grid-template-columns: 1fr; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="badge">⚡ 電費計算工具</div>
    <h1>分租電費<span>自動計算</span></h1>
    <p class="subtitle">每月輸入電錶數字，自動算出各自應付金額</p>
  </header>

  <div class="install-banner" id="installBanner">
    <div class="install-text">
      <strong>📲 加入手機桌面</strong>
      安裝後可離線使用，體驗更像原生 App
    </div>
    <button class="install-btn" id="installBtn">安裝</button>
    <button class="install-dismiss" onclick="dismissInstall()">✕</button>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-yellow">📅</div>
      <div>
        <div class="card-title">帳單月份</div>
        <div class="card-desc">選擇本次計算的帳單月份</div>
      </div>
    </div>
    <div class="month-row">
      <button class="month-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-display" id="monthDisplay"></div>
      <button class="month-btn" onclick="changeMonth(1)">▶</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-blue">🏢</div>
      <div>
        <div class="card-title">台電帳單資料</div>
        <div class="card-desc">從電費單上輸入總用電度數與總金額</div>
      </div>
    </div>
    <div class="field-grid">
      <div class="field">
        <label>本期總用電量</label>
        <div class="input-wrap">
          <input type="number" id="totalKwh" placeholder="0" inputmode="decimal" oninput="calculate()">
          <span class="input-unit">度</span>
        </div>
      </div>
      <div class="field">
        <label>本期總電費</label>
        <div class="input-wrap">
          <input type="number" id="totalAmount" placeholder="0" inputmode="decimal" oninput="calculate()">
          <span class="input-unit">元</span>
        </div>
      </div>
      <div class="field full">
        <label>每度電費（自動計算）</label>
        <div class="derived" id="pricePerKwh">— 元 / 度</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-yellow">🔌</div>
      <div>
        <div class="card-title">分租方電錶讀數</div>
        <div class="card-desc">輸入分租方的電錶數字（上月 → 本月）</div>
      </div>
    </div>
    <div class="field-grid">
      <div class="field">
        <label>上個月電錶數字</label>
        <div class="input-wrap">
          <input type="number" id="prevMeter" placeholder="0" inputmode="decimal" oninput="calculate()">
          <span class="input-unit">度</span>
        </div>
      </div>
      <div class="field">
        <label>這個月電錶數字</label>
        <div class="input-wrap">
          <input type="number" id="currMeter" placeholder="0" inputmode="decimal" oninput="calculate()">
          <span class="input-unit">度</span>
        </div>
      </div>
      <div class="field full">
        <label>分租方本月用電量（自動計算）</label>
        <div class="derived" id="tenantKwh">— 度</div>
      </div>
    </div>
  </div>

  <div class="result-card">
    <div class="card-header" style="margin-bottom:14px">
      <div class="card-icon icon-green">📊</div>
      <div>
        <div class="card-title">計算結果</div>
        <div class="card-desc" id="resultMonth">尚未計算</div>
      </div>
    </div>
    <div class="result-row">
      <span class="result-label">📦 每度電費</span>
      <span class="result-value accent" id="r_pricePerKwh">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">🔌 分租方用電</span>
      <span class="result-value" id="r_tenantKwh">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">🏠 我的用電（推算）</span>
      <span class="result-value" id="r_myKwh">—</span>
    </div>
    <div class="big-amounts">
      <div class="amount-box me">
        <div class="amount-person">我 應付</div>
        <div class="amount-number" id="r_myAmount">—</div>
        <div class="amount-unit">元</div>
      </div>
      <div class="amount-box tenant">
        <div class="amount-person">分租方 應付</div>
        <div class="amount-number" id="r_tenantAmount">—</div>
        <div class="amount-unit">元</div>
      </div>
    </div>
  </div>

  <div class="notion-section">
    <div class="notion-header">
      <div class="notion-title">
        <div class="notion-logo">N</div>
        <span>複製到 Notion</span>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyNotion()">
        <span>📋</span> 複製
      </button>
    </div>
    <div class="notion-preview" id="notionPreview">（輸入資料後自動生成）</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-blue">📁</div>
      <div>
        <div class="card-title">歷史記錄</div>
        <div class="card-desc">點選月份可載入舊資料</div>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="save-btn" onclick="saveRecord()">💾 儲存本月記錄</button>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW err:', err));
    });
  }

  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('install_dismissed')) {
      document.getElementById('installBanner').classList.add('show');
    }
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  });

  function dismissInstall() {
    document.getElementById('installBanner').classList.remove('show');
    localStorage.setItem('install_dismissed', '1');
  }

  let currentDate = new Date();
  let history = JSON.parse(localStorage.getItem('elec_history') || '[]');

  function pad(n) { return String(n).padStart(2,'0'); }
  function getMonthStr(d) { return `${d.getFullYear()} 年 ${pad(d.getMonth()+1)} 月`; }
  function getMonthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

  function changeMonth(delta) {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
    updateMonthDisplay();
    calculate();
  }

  function updateMonthDisplay() {
    document.getElementById('monthDisplay').textContent = getMonthStr(currentDate);
  }

  function calculate() {
    const totalKwh = parseFloat(document.getElementById('totalKwh').value) || 0;
    const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
    const prevMeter = parseFloat(document.getElementById('prevMeter').value) || 0;
    const currMeter = parseFloat(document.getElementById('currMeter').value) || 0;

    if (totalKwh <= 0 || totalAmount <= 0) {
      document.getElementById('pricePerKwh').textContent = '— 元 / 度';
      document.getElementById('tenantKwh').textContent = '— 度';
      updateResults(null);
      return;
    }

    const pricePerKwh = totalAmount / totalKwh;
    const tenantKwh = Math.max(0, currMeter - prevMeter);
    const myKwh = Math.max(0, totalKwh - tenantKwh);
    const tenantAmount = tenantKwh * pricePerKwh;
    const myAmount = totalAmount - tenantAmount;

    document.getElementById('pricePerKwh').textContent = `${pricePerKwh.toFixed(2)} 元 / 度`;
    document.getElementById('tenantKwh').textContent = tenantKwh > 0 ? `${tenantKwh.toFixed(1)} 度` : '— 度（請確認電錶數字）';

    updateResults({ pricePerKwh, tenantKwh, myKwh, tenantAmount, myAmount, totalKwh, totalAmount, prevMeter, currMeter });
  }

  function updateResults(data) {
    document.getElementById('resultMonth').textContent = getMonthStr(currentDate);

    if (!data) {
      ['r_pricePerKwh','r_tenantKwh','r_myKwh','r_myAmount','r_tenantAmount'].forEach(id => {
        document.getElementById(id).textContent = '—';
      });
      document.getElementById('notionPreview').textContent = '（輸入資料後自動生成）';
      return;
    }

    document.getElementById('r_pricePerKwh').textContent = `${data.pricePerKwh.toFixed(2)} 元`;
    document.getElementById('r_tenantKwh').textContent = `${data.tenantKwh.toFixed(1)} 度`;
    document.getElementById('r_myKwh').textContent = `${data.myKwh.toFixed(1)} 度`;
    document.getElementById('r_myAmount').textContent = Math.round(data.myAmount).toLocaleString();
    document.getElementById('r_tenantAmount').textContent = Math.round(data.tenantAmount).toLocaleString();
    updateNotionPreview(data);
  }

  function updateNotionPreview(data) {
    const monthStr = getMonthStr(currentDate);
    const totalKwh = parseFloat(document.getElementById('totalKwh').value) || 0;
    const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
    const text = `# ⚡ ${monthStr} 電費記錄\n\n## 帳單資訊\n- **帳單月份**：${monthStr}\n- **總用電量**：${totalKwh} 度\n- **總電費**：${totalAmount.toLocaleString()} 元\n- **每度電費**：${data.pricePerKwh.toFixed(2)} 元\n\n## 分租方電錶\n- **上月錶數**：${data.prevMeter} 度\n- **本月錶數**：${data.currMeter} 度\n- **本月用電**：${data.tenantKwh.toFixed(1)} 度\n\n## 費用分攤\n| 項目 | 用電量 | 應付金額 |\n|------|--------|----------|\n| 🏠 我 | ${data.myKwh.toFixed(1)} 度 | ${Math.round(data.myAmount).toLocaleString()} 元 |\n| 🔌 分租方 | ${data.tenantKwh.toFixed(1)} 度 | ${Math.round(data.tenantAmount).toLocaleString()} 元 |\n| **合計** | **${totalKwh} 度** | **${totalAmount.toLocaleString()} 元** |`;
    document.getElementById('notionPreview').textContent = text;
  }

  function copyNotion() {
    const text = document.getElementById('notionPreview').textContent;
    if (text === '（輸入資料後自動生成）') return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = '<span>✓</span> 已複製';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<span>📋</span> 複製'; }, 2000);
    });
  }

  function saveRecord() {
    const totalKwh = parseFloat(document.getElementById('totalKwh').value) || 0;
    const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
    const prevMeter = parseFloat(document.getElementById('prevMeter').value) || 0;
    const currMeter = parseFloat(document.getElementById('currMeter').value) || 0;

    if (!totalKwh || !totalAmount) { alert('請先輸入帳單資料再儲存！'); return; }

    const key = getMonthKey(currentDate);
    const existing = history.findIndex(h => h.key === key);
    const record = { key, monthStr: getMonthStr(currentDate), totalKwh, totalAmount, prevMeter, currMeter };

    if (existing >= 0) history[existing] = record;
    else history.unshift(record);

    history = history.slice(0, 24);
    localStorage.setItem('elec_history', JSON.stringify(history));
    renderHistory();

    if (navigator.vibrate) navigator.vibrate(50);
  }

  function loadRecord(record) {
    const [y, m] = record.key.split('-').map(Number);
    currentDate = new Date(y, m - 1, 1);
    updateMonthDisplay();
    document.getElementById('totalKwh').value = record.totalKwh;
    document.getElementById('totalAmount').value = record.totalAmount;
    document.getElementById('prevMeter').value = record.prevMeter;
    document.getElementById('currMeter').value = record.currMeter;
    calculate();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteRecord(key, e) {
    e.stopPropagation();
    if (!confirm('確定刪除這筆記錄？')) return;
    history = history.filter(h => h.key !== key);
    localStorage.setItem('elec_history', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<div class="empty-history">尚無歷史記錄</div>';
      return;
    }
    list.innerHTML = history.map(h => {
      const tenantKwh = Math.max(0, h.currMeter - h.prevMeter);
      const pricePerKwh = h.totalAmount / h.totalKwh;
      const tenantAmount = Math.round(tenantKwh * pricePerKwh);
      const myAmount = Math.round(h.totalAmount - tenantAmount);
      return `<div class="history-item" onclick="loadRecord(${JSON.stringify(h).replace(/"/g,'&quot;')})">
        <div>
          <div class="history-month">${h.monthStr}</div>
          <div class="history-amounts">我：${myAmount.toLocaleString()} 元 ／ 分租：${tenantAmount.toLocaleString()} 元</div>
        </div>
        <button class="history-del" onclick="deleteRecord('${h.key}', event)">✕</button>
      </div>`;
    }).join('');
  }

  updateMonthDisplay();
  renderHistory();
</script>
</body>
</html>
